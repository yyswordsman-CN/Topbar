name: Topbar
options:
  bundleIdPrefix: com.yangzhiyi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: false  # 使用自定义 Info.plist

targets:
  Topbar:
    type: application
    platform: macOS
    sources:
      - path: Topbar
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangzhiyi.topbar
        PRODUCT_NAME: Topbar
        INFOPLIST_FILE: Topbar/Info.plist
        CODE_SIGN_ENTITLEMENTS: Topbar/Topbar.entitlements
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Topbar Dev"
        SWIFT_STRICT_CONCURRENCY: complete
